<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Весёлая Ферма 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #111;
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            max-height: 850px;
            background: #3e8e41;
            border: 4px solid #3d2314;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #top-bar {
            background: linear-gradient(180deg, #5b3a1a 0%, #3d2314 100%);
            border-bottom: 3px solid #f3c242;
            padding: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            z-index: 10;
        }
        .shop-btn {
            background: linear-gradient(180deg, #ffca28 0%, #ff8f00 100%);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 4px 6px;
            font-size: 11px;
            font-weight: bold;
            color: #3e2723;
            cursor: pointer;
            box-shadow: 0 2px 0 #b78103;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }
        .shop-btn:active { transform: translateY(2px); box-shadow: none; }
        
        #ui-stats {
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }
        #canvas {
            flex: 1;
            width: 100%;
            height: 100%;
            touch-action: manipulation;
        }
        #bottom-bar {
            background: linear-gradient(180deg, #4e2f18 0%, #2c1a0e 100%);
            padding: 8px;
            display: flex;
            justify-content: space-around;
            z-index: 10;
            border-top: 3px solid #f3c242;
        }
        .action-btn {
            background: linear-gradient(180deg, #66bb6a 0%, #2e7d32 100%);
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 3px 0 #1b5e20;
            text-shadow: 1px 1px 2px #000;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <button class="shop-btn" onclick="buyAnimal('chicken')">🐔 Курица ($100)</button>
        <button class="shop-btn" onclick="buyAnimal('pig')">🐷 Свинья ($1000)</button>
        <button class="shop-btn" onclick="buyAnimal('cow')">🐮 Корова ($10000)</button>
        <button class="shop-btn" onclick="buyHelper('cat')">🐱 Кот ($2500)</button>
        <button class="shop-btn" onclick="buyHelper('dog')">🐶 Пёс ($2500)</button>
    </div>

    <div id="ui-stats">
        <div>💰 $<span id="money">300</span></div>
        <div>💧 Вода: <span id="water">5</span>/5</div>
        <div>📦 Склад: <span id="storage">0</span>/15</div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="bottom-bar">
        <div class="action-btn" onclick="refillWell()">💧 Колодец<br>($19)</div>
        <div class="action-btn" onclick="sendPlane()">✈️ Самолёт<br>(Заказ)</div>
        <div class="action-btn" onclick="sendTruck()">🚚 Грузовик<br>(Продать)</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let money = 300;
let water = 5;
const maxWater = 5;
let warehouse = [];
const maxStorage = 15;

function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight - 130;
}
resize();

// Списки объектов
let grasses = [];
let animals = [];
let helpers = [];
let items = [];
let bears = [];

// Цены ресурсов
const PRICES = {
    egg: 10, powder: 20, cake: 50,
    meat: 80, mince: 160, delicacy: 400,
    milk: 200, butter: 500, cheese: 1200,
    bear: 100
};

// Заводы (построены вокруг поля)
let factories = [
    { id: 'f_powder', name: 'Порошок', input: 'egg', output: 'powder', x: 10, y: 10, w: 75, h: 50, built: false, price: 150, working: false, progress: 0 },
    { id: 'f_cake', name: 'Кексы', input: 'powder', output: 'cake', x: 95, y: 10, w: 75, h: 50, built: false, price: 300, working: false, progress: 0 },
    { id: 'f_mince', name: 'Фарш', input: 'meat', output: 'mince', x: 180, y: 10, w: 75, h: 50, built: false, price: 1500, working: false, progress: 0 },
    { id: 'f_deli', name: 'Деликатес', input: 'delicacy', output: 'delicacy', x: 10, y: canvas.height - 60, w: 75, h: 50, built: false, price: 3000, working: false, progress: 0 },
    { id: 'f_butter', name: 'Масло', input: 'milk', output: 'butter', x: 95, y: canvas.height - 60, w: 75, h: 50, built: false, price: 12000, working: false, progress: 0 },
    { id: 'f_cheese', name: 'Сыр', input: 'butter', output: 'cheese', x: 180, y: canvas.height - 60, w: 75, h: 50, built: false, price: 20000, working: false, progress: 0 }
];

// --- ОТРИСОВКА МОДЕЛЕЙ ---

function drawBackground() {
    // Трава
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Дорожки
    ctx.fillStyle = '#c8b98a';
    ctx.fillRect(0, 0, canvas.width, 70);
    ctx.fillRect(0, canvas.height - 70, canvas.width, 70);
}

function drawGrass(g) {
    ctx.fillStyle = '#2e7d32';
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(g.x + (i * 4 - 8), g.y + (i % 2 * 3), 6, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawAnimal(a) {
    ctx.save();
    ctx.translate(a.x, a.y);

    if (a.type === 'chicken') {
        // Оперение
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        // Гребешок
        ctx.fillStyle = '#e53935';
        ctx.beginPath(); ctx.arc(-2, -13, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(2, -14, 4, 0, Math.PI * 2); ctx.fill();
        // Клюв и глазик
        ctx.fillStyle = '#fb8c00';
        ctx.beginPath(); ctx.moveTo(8, -2); ctx.lineTo(14, 1); ctx.lineTo(8, 4); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(4, -4, 2, 0, Math.PI * 2); ctx.fill();
    } else if (a.type === 'pig') {
        // Тело
        ctx.fillStyle = '#f48fb1';
        ctx.beginPath(); ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2); ctx.fill();
        // Пятачок
        ctx.fillStyle = '#f06292';
        ctx.beginPath(); ctx.arc(12, 2, 5, 0, Math.PI * 2); ctx.fill();
        // Ушки
        ctx.beginPath(); ctx.arc(-6, -10, 4, 0, Math.PI * 2); ctx.fill();
        // Глаз
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(6, -3, 2, 0, Math.PI * 2); ctx.fill();
    } else if (a.type === 'cow') {
        // Тело и пятна
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#424242';
        ctx.beginPath(); ctx.arc(-6, -4, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, 4, 5, 0, Math.PI * 2); ctx.fill();
        // Мордочка и рожки
        ctx.fillStyle = '#ffe0b2';
        ctx.beginPath(); ctx.arc(16, 2, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb300';
        ctx.beginPath(); ctx.arc(12, -8, 3, 0, Math.PI * 2); ctx.fill();
        // Глаз
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(14, -1, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function drawHelper(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    if (h.type === 'cat') {
        ctx.fillStyle = '#ff9800';
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
        // Ушки
        ctx.beginPath(); ctx.lineTo(-6, -10); ctx.lineTo(-2, -6); ctx.lineTo(-8, -2); ctx.fill();
        ctx.beginPath(); ctx.lineTo(6, -10); ctx.lineTo(2, -6); ctx.lineTo(8, -2); ctx.fill();
    } else if (h.type === 'dog') {
        ctx.fillStyle = '#8d6e63';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3e2723';
        ctx.beginPath(); ctx.arc(-8, -2, 5, 0, Math.PI * 2); ctx.fill(); // Пятно
    }
    ctx.restore();
}

function drawBear(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = '#4e342e';
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-14, -14, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(14, -14, 7, 0, Math.PI * 2); ctx.fill();
    // Морда
    ctx.fillStyle = '#d7ccc8';
    ctx.beginPath(); ctx.arc(0, 4, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(0, 1, 3, 0, Math.PI * 2); ctx.fill();

    // Клетка
    if (b.clicks > 0) {
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 4;
        let sz = 46 - b.clicks * 12;
        ctx.strokeRect(-sz/2, -sz/2, sz, sz);
    }
    ctx.restore();
}

function drawItem(item) {
    ctx.save();
    ctx.translate(item.x, item.y);
    
    // Подсветка предмета
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();

    if (item.type === 'egg') {
        ctx.fillStyle = '#fff8e1';
        ctx.beginPath(); ctx.ellipse(0, 0, 6, 9, 0, 0, Math.PI * 2); ctx.fill();
    } else if (item.type === 'powder') {
        ctx.fillStyle = '#fff176';
        ctx.fillRect(-6, -6, 12, 12);
    } else if (item.type === 'cake') {
        ctx.fillStyle = '#ec407a';
        ctx.beginPath(); ctx.arc(0, 2, 7, 0, Math.PI * 2); ctx.fill();
    } else if (item.type === 'meat') {
        ctx.fillStyle = '#e57373';
        ctx.fillRect(-7, -5, 14, 10);
    } else if (item.type === 'milk') {
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(-5, -7, 10, 14);
    } else if (item.type === 'bear') {
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(-10, -10, 20, 20);
        ctx.strokeStyle = '#fff'; ctx.strokeRect(-10, -10, 20, 20);
    } else {
        ctx.fillStyle = '#ba68c8';
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function drawFactories() {
    factories.forEach(f => {
        ctx.save();
        if (f.built) {
            ctx.fillStyle = '#78909c';
            ctx.fillRect(f.x, f.y, f.w, f.h);
            ctx.strokeStyle = '#37474f';
            ctx.strokeRect(f.x, f.y, f.w, f.h);

            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial';
            ctx.fillText(f.name, f.x + 5, f.y + 18);

            if (f.working) {
                ctx.fillStyle = '#ffca28';
                ctx.fillRect(f.x, f.y + f.h - 6, (f.progress / 100) * f.w, 6);
            }
        } else {
            // Место под постройку
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(f.x, f.y, f.w, f.h);
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(f.x, f.y, f.w, f.h);
            ctx.fillStyle = '#fff';
            ctx.font = '9px Arial';
            ctx.fillText(`+ ${f.name}`, f.x + 5, f.y + 20);
            ctx.fillText(`$${f.price}`, f.x + 5, f.y + 35);
        }
        ctx.restore();
    });
}

// --- ЛОГИКА ВЗАИМОДЕЙСТВИЯ ---

canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // 1. Клики по заводам
    for (let f of factories) {
        if (x >= f.x && x <= f.x + f.w && y >= f.y && y <= f.y + f.h) {
            if (!f.built) {
                if (money >= f.price) {
                    money -= f.price;
                    f.built = true;
                    updateUI();
                }
            } else if (!f.working) {
                // Проверяем наличие сырья на складе
                let idx = warehouse.indexOf(f.input);
                if (idx !== -1) {
                    warehouse.splice(idx, 1);
                    f.working = true;
                    f.progress = 0;
                    updateUI();
                }
            }
            return;
        }
    }

    // 2. Сбор предметов
    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        if (Math.hypot(it.x - x, it.y - y) < 25) {
            if (warehouse.length < maxStorage) {
                warehouse.push(it.type);
                items.splice(i, 1);
                updateUI();
            }
            return;
        }
    }

    // 3. Ловля медведей
    for (let i = bears.length - 1; i >= 0; i--) {
        let b = bears[i];
        if (Math.hypot(b.x - x, b.y - y) < 30) {
            b.clicks++;
            if (b.clicks >= 3) {
                items.push({ x: b.x, y: b.y, type: 'bear' });
                bears.splice(i, 1);
            }
            return;
        }
    }

    // 4. Полив травы на игровом поле
    if (y > 70 && y < canvas.height - 70 && water > 0) {
        water--;
        grasses.push({ x, y });
        updateUI();
    }
});

// --- МАГАЗИН И УПРАВЛЕНИЕ ---

function buyAnimal(type) {
    let cost = type === 'chicken' ? 100 : type === 'pig' ? 1000 : 10000;
    if (money >= cost) {
        money -= cost;
        animals.push({
            type,
            x: Math.random() * (canvas.width - 80) + 40,
            y: Math.random() * (canvas.height - 200) + 100,
            timer: 0
        });
        updateUI();
    }
}

function buyHelper(type) {
    if (money >= 2500) {
        money -= 2500;
        helpers.push({
            type,
            x: canvas.width / 2,
            y: canvas.height / 2
        });
        updateUI();
    }
}

function refillWell() {
    if (money >= 19 && water < maxWater) {
        money -= 19;
        water = maxWater;
        updateUI();
    }
}

function sendTruck() {
    if (warehouse.length > 0) {
        let sum = 0;
        warehouse.forEach(type => sum += (PRICES[type] || 10));
        money += sum;
        warehouse = [];
        updateUI();
    }
}

function sendPlane() {
    // Вспомогательная доставка за 100$ (наполняет воду)
    if (money >= 100) {
        money -= 100;
        water = maxWater;
        updateUI();
    }
}

function updateUI() {
    document.getElementById('money').innerText = money;
    document.getElementById('water').innerText = water;
    document.getElementById('storage').innerText = warehouse.length;
}

// Появление медведей
setInterval(() => {
    if (Math.random() < 0.4 && bears.length < 2) {
        bears.push({
            x: Math.random() * (canvas.width - 80) + 40,
            y: Math.random() * (canvas.height - 200) + 100,
            clicks: 0
        });
    }
}, 9000);

// --- ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ ---

function gameLoop() {
    drawBackground();
    drawFactories();

    // Трава
    grasses.forEach(g => drawGrass(g));

    // Обновление заводов
    factories.forEach(f => {
        if (f.working) {
            f.progress += 0.8;
            if (f.progress >= 100) {
                f.working = false;
                items.push({ x: f.x + f.w / 2, y: f.y + f.h + 15, type: f.output });
            }
        }
    });

    // Животные
    animals.forEach(a => {
        // Поиск ближайшей травы
        if (grasses.length > 0) {
            let target = grasses[0];
            let dist = Math.hypot(target.x - a.x, target.y - a.y);
            if (dist > 5) {
                a.x += (target.x - a.x) / dist * 0.9;
                a.y += (target.y - a.y) / dist * 0.9;
            } else {
                grasses.shift();
            }
        }

        // Производство продуктов
        a.timer += 1;
        if (a.timer > 350) {
            let prod = a.type === 'chicken' ? 'egg' : a.type === 'pig' ? 'meat' : 'milk';
            items.push({ x: a.x, y: a.y, type: prod });
            a.timer = 0;
        }

        drawAnimal(a);
    });

    // Помощники
    helpers.forEach(h => {
        if (h.type === 'cat' && items.length > 0) {
            // Кот собирает предметы
            let target = items[0];
            let dist = Math.hypot(target.x - h.x, target.y - h.y);
            if (dist > 5) {
                h.x += (target.x - h.x) / dist * 1.5;
                h.y += (target.y - h.y) / dist * 1.5;
            } else if (warehouse.length < maxStorage) {
                warehouse.push(target.type);
                items.shift();
                updateUI();
            }
        } else if (h.type === 'dog' && bears.length > 0) {
            // Пёс прогоняет медведей
            let target = bears[0];
            let dist = Math.hypot(target.x - h.x, target.y - h.y);
            if (dist > 5) {
                h.x += (target.x - h.x) / dist * 2;
                h.y += (target.y - h.y) / dist * 2;
            } else {
                bears.shift();
            }
        }
        drawHelper(h);
    });

    // Предметы и Медведи
    items.forEach(it => drawItem(it));
    bears.forEach(b => drawBear(b));

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
